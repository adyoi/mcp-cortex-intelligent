<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="mcp-cortex-intelligent logo">
  <defs>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00f0ff"/>
      <stop offset="0.5" stop-color="#7c4dff"/>
      <stop offset="1" stop-color="#ff2d95"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#00f0ff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#0a0a1a" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="256" height="256" rx="36" fill="#0a0a1a"/>
  <g filter="url(#glow)">
    <polygon points="128,24 216,76 216,180 128,232 40,180 40,76" fill="none" stroke="url(#neon)" stroke-width="4"/>
    <polygon points="128,52 192,88 192,168 128,204 64,168 64,88" fill="none" stroke="url(#neon)" stroke-width="2" opacity="0.6"/>
  </g>
  <circle cx="128" cy="128" r="46" fill="url(#core)"/>
  <text x="128" y="148" text-anchor="middle" font-family="Orbitron,Consolas,monospace" font-size="52" font-weight="700" fill="#ffffff" filter="url(#glow)">CX</text>
  <g stroke="url(#neon)" stroke-width="2" fill="none" opacity="0.7">
    <line x1="128" y1="24" x2="128" y2="0"/>
    <line x1="216" y1="76" x2="256" y2="56"/>
    <line x1="216" y1="180" x2="256" y2="200"/>
    <line x1="128" y1="232" x2="128" y2="256"/>
    <line x1="40" y1="180" x2="0" y2="200"/>
    <line x1="40" y1="76" x2="0" y2="56"/>
  </g>
</svg>
