    <circle cx="128" cy="128" r="60"/>
    <circle cx="128" cy="128" r="30"/>
  </g>
  <g fill="url(#g1)">
    <rect x="120" y="20" width="16" height="40" rx="4"/>
    <rect x="120" y="196" width="16" height="40" rx="4"/>
    <rect x="20" y="120" width="40" height="16" rx="4"/>
    <rect x="196" y="120" width="40" height="16" rx="4"/>
  </g>
  <text x="128" y="140" text-anchor="middle" font-family="Consolas,monospace" font-size="44" font-weight="bold" fill="url(#g1)">CX</text>
  <text x="128" y="230" text-anchor="middle" font-family="Consolas,monospace" font-size="14" fill="#00e5ff">CORTEX INTELLIGENT</text>
</svg>
